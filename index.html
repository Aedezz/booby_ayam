<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir AYAM BOBBY</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 antialiased selection:bg-red-200">

<div class="max-w-md mx-auto bg-white min-h-screen relative pb-32 shadow-xl">

    <!-- HEADER -->
    <header class="sticky top-0 bg-white border-b border-gray-100 p-4 z-10 flex justify-between items-center shadow-sm">
        <div>
            <h1 class="text-xl font-extrabold text-red-600 tracking-tight">AYAM BOBBY</h1>
            <p id="tanggalHariIni" class="text-xs text-gray-400 font-medium"></p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="bukaModalRiwayat()" class="text-xs font-bold text-gray-500 hover:text-red-500 bg-gray-50 px-3 py-1.5 rounded-full transition-colors">
                Riwayat
            </button>
            <button onclick="resetData()" class="text-xs font-bold text-gray-400 hover:text-red-500 bg-gray-50 px-3 py-1.5 rounded-full transition-colors">
                Reset Hari Ini
            </button>
        </div>
    </header>

    <!-- MENU LIST CONTAINER -->
    <main class="p-4" id="menuContainer">
        <!-- Render via JavaScript -->
    </main>

    <!-- BOTTOM ACTION BAR -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 p-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-20">
        <div class="flex justify-between items-center mb-3">
            <span class="text-sm font-semibold text-gray-500">Total Omset:</span>
            <span id="totalOmset" class="text-xl font-bold text-gray-900">Rp 0</span>
        </div>
        <button onclick="copyToWA()" class="w-full bg-red-600 hover:bg-red-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl transition-all shadow-md shadow-red-200">
            Copy ke WhatsApp
        </button>
    </div>

    <!-- MODAL RIWAYAT -->
    <div id="modalRiwayat" class="hidden fixed inset-0 bg-black/40 z-30 flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-2xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center p-4 border-b border-gray-100">
                <h2 class="font-bold text-gray-800">Riwayat</h2>
                <button onclick="tutupModalRiwayat()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 font-bold">✕</button>
            </div>

            <div class="flex gap-2 p-4 pb-0">
                <button id="tabHariIni" onclick="gantiTabRiwayat('hariini')" class="flex-1 text-xs font-bold py-2 rounded-full transition-colors bg-red-600 text-white">Hari Ini</button>
                <button id="tabArsip" onclick="gantiTabRiwayat('arsip')" class="flex-1 text-xs font-bold py-2 rounded-full transition-colors bg-gray-100 text-gray-500">Arsip</button>
            </div>

            <div class="p-4 overflow-y-auto">
                <!-- PANEL HARI INI -->
                <div id="panelHariIni">
                    <div id="riwayatHariIniList"></div>
                </div>

                <!-- PANEL ARSIP -->
                <div id="panelArsip" class="hidden">
                    <div id="riwayatArsipList"></div>
                    <div id="riwayatArsipDetail" class="hidden">
                        <button onclick="tutupDetailArsip()" class="text-xs font-bold text-gray-400 mb-3">← Kembali ke daftar arsip</button>
                        <div id="riwayatArsipDetailContent"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- SCRIPT LOADING ORDER -->
<script src="data.js"></script>
<script src="script.js"></script>

<!-- <script src="data.js?v=2"></script>
<script src="script.js?v=2"></script> -->

</body>
</html>
